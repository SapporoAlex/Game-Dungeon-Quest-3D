<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0f06">
<meta name="description" content="A first-person 3D dungeon crawler: sword, lightning magic, dragons and a shop run by an elf.">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Dungeon Quest 3D">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Dungeon Quest 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&display=swap">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Alegreya','Palatino Linotype','Book Antiqua',Georgia,serif;color:#f0e2b8;user-select:none}
  :root{--display:'Cinzel Decorative','Cinzel','Palatino Linotype',Georgia,serif;--ui:'Cinzel','Palatino Linotype','Book Antiqua',Georgia,serif;--gold:#d8b25a;--gold-d:#8a6a2c}
  #game{position:fixed;inset:0} #game canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;display:none}
  #hud .panel{position:absolute;background:rgba(14,9,4,.62);border:2px solid #8a6a2c;border-radius:10px;padding:8px 12px}
  #bl{left:16px;bottom:16px;min-width:230px}
  #hearts.many{max-width:300px;line-height:1} #hearts.many span{font-size:19px}
  #hearts span{font-size:26px;margin-right:2px;text-shadow:0 2px 2px #000} #hearts .full{color:#e8303c} #hearts .empty{color:#4a2024}
  .manawrap{position:relative;height:20px;margin-top:6px;background:#0c1a10;border:2px solid #2d6a3c;border-radius:6px;overflow:hidden}
  #manaFill{height:100%;width:100%;background:linear-gradient(90deg,#1fa84a,#5cff8a);transition:width .2s}
  #manaTxt{position:absolute;inset:0;text-align:center;font-size:13px;line-height:20px;font-weight:bold;text-shadow:0 1px 2px #000}
  #br{right:16px;bottom:16px;text-align:right;line-height:1.5}
  #amulet{display:none;color:#ffb0d0;font-size:15px;font-family:var(--ui);text-shadow:0 0 10px rgba(255,80,140,.7)}
  #br b{color:#ffd24a;font-size:20px;font-family:var(--ui)} .keys{font-size:12px;opacity:.8}
  #tl{left:16px;top:16px;max-width:360px} #lvlTitle{font-family:var(--ui);font-weight:700;font-size:17px;color:#ffd24a;letter-spacing:.04em} #objective{font-size:14px;margin-top:2px}
  #minimap{position:absolute;right:16px;top:16px;border:2px solid #8a6a2c;border-radius:6px;background:rgba(0,0,0,.55);width:200px;height:160px}
  #cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px}
  #cross:before,#cross:after{content:"";position:absolute;background:rgba(255,240,200,.85)}
  #cross:before{left:8px;top:0;width:2px;height:18px;clip-path:polygon(0 0,100% 0,100% 35%,0 35%,0 65%,100% 65%,100% 100%,0 100%)}
  #cross:after{top:8px;left:0;height:2px;width:18px;clip-path:polygon(0 0,35% 0,35% 100%,0 100%,65% 0,100% 0,100% 100%,65% 100%)}
  #prompt{position:absolute;left:0;right:0;top:57%;text-align:center;font-size:20px;font-weight:bold;text-shadow:0 2px 4px #000;opacity:0;transition:opacity .15s}
  #msg{position:absolute;left:50%;top:14%;transform:translateX(-50%);max-width:70%;text-align:center;font-size:20px;padding:10px 18px;background:rgba(14,9,4,.7);border:2px solid #d8b25a;border-radius:10px;opacity:0;transition:opacity .3s}
  #flash{position:absolute;inset:0;opacity:0;pointer-events:none}
  #boss{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:420px;display:none;text-align:center}
  #bossFill{height:14px;width:100%;background:linear-gradient(90deg,#8a1010,#ff3c2a);border-radius:5px} #bossBar{border:2px solid #d8b25a;border-radius:7px;padding:2px;background:rgba(0,0,0,.6)}
  #bubble{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);width:min(620px,86%);display:none;background:rgba(20,32,18,.88);border:3px solid #7ad08a;border-radius:14px;padding:12px 18px;font-size:19px;line-height:1.35}
  #bubble b{color:#9bffb0}
  /* ---------- menus ---------- */
  #screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow-y:auto;padding:20px 12px;box-sizing:border-box;text-align:center;z-index:5;
    background:radial-gradient(ellipse at 50% 35%,rgba(70,38,10,.55),rgba(8,4,2,.93) 70%),repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 64px),#050302}
  #screen:before{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 40px #000}
  #screen>*{position:relative;flex:none}
  #screen>.menu,#screen>#levelList{margin-top:0}
  #screen h1{font:900 clamp(34px,6.4vw,68px)/1 var(--display);margin:4px 0 0;letter-spacing:.06em;text-transform:uppercase;
    background:linear-gradient(180deg,#fff2c0 0%,#ffd24a 40%,#c07a18 62%,#ffd24a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 #4a2606) drop-shadow(0 0 18px rgba(255,140,30,.55))}
  #screen h1 span{font-size:.6em;letter-spacing:.2em}
  #screen h2{font:700 clamp(26px,4vw,40px)/1.1 var(--display);margin:0 0 4px;color:#ffd24a;letter-spacing:.06em;text-shadow:0 3px 0 #4a2606,0 0 22px rgba(255,140,30,.45)}
  #screen h2.dead{color:#ff5a4a;text-shadow:0 3px 0 #4a0806,0 0 26px rgba(255,40,20,.55)}
  #screen p{max-width:640px;line-height:1.45;font-size:19px;margin:6px 0}
  #screen p.tag{font-style:italic;color:#e6d6a8;max-width:560px} #screen p.note{color:#9bffb0;font-style:italic} #screen p.stats{font-family:var(--ui);font-size:15px;letter-spacing:.04em;background:rgba(0,0,0,.4);border:1px solid var(--gold-d);padding:7px 16px;border-radius:3px}
  #screen p.stats b{color:#ffd24a}
  .crest{font-size:34px;color:var(--gold);filter:drop-shadow(0 0 10px rgba(255,160,40,.7));line-height:1}
  .rule{display:flex;align-items:center;gap:12px;width:min(420px,80vw);margin:10px auto;color:var(--gold);font:700 13px var(--ui);letter-spacing:.3em;text-transform:uppercase}
  .rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative} .rule i:only-child:after{content:"❖";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#0b0603;padding:0 8px;font-style:normal;font-size:12px}
  .menu{display:flex;flex-direction:column;align-items:center;margin:6px 0} .menu.row{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .btn{position:relative;pointer-events:auto;cursor:pointer;margin:7px;padding:13px 46px;min-width:290px;box-sizing:border-box;font:700 19px/1.15 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#f3e3b4;
    background:linear-gradient(180deg,#4d361a 0%,#2c1d0d 52%,#1a1107 100%);border:1px solid #b8923c;border-radius:3px;
    box-shadow:inset 0 0 0 3px #1a1006,inset 0 0 0 4px #8a6a2c,0 6px 16px rgba(0,0,0,.65);text-shadow:0 2px 0 #000;transition:transform .12s,box-shadow .18s,background .18s,color .18s}
  .btn:before,.btn:after{content:"❖";position:absolute;top:50%;transform:translateY(-50%);color:#b8923c;font-size:11px;opacity:.75;transition:opacity .18s,color .18s}
  .btn:before{left:16px} .btn:after{right:16px}
  .btn small{display:block;margin-top:5px;font:italic 400 15px 'Alegreya',Georgia,serif;letter-spacing:.02em;text-transform:none;color:#d8c692}
  .btn:hover,.btn.focus,.btn:focus-visible{outline:none;color:#fff7dc;background:linear-gradient(180deg,#6e4d22 0%,#3e2a12 55%,#2a1b0a 100%);transform:translateY(-1px);
    box-shadow:inset 0 0 0 3px #1a1006,inset 0 0 0 4px #ffd24a,0 6px 16px rgba(0,0,0,.65),0 0 26px rgba(255,170,50,.5)}
  .btn:hover:before,.btn:hover:after,.btn.focus:before,.btn.focus:after,.btn:focus-visible:before,.btn:focus-visible:after{opacity:1;color:#ffd24a}
  .btn:active{transform:translateY(1px)}
  .btn.small{min-width:0;padding:9px 30px;font-size:14px}
  .btn.focus{outline:2px solid #9bffb0;outline-offset:3px}
  .help{display:grid;grid-template-columns:auto auto;gap:3px 22px;font-size:16px;text-align:left;margin:12px 0;background:rgba(0,0,0,.4);border:1px solid rgba(138,106,44,.6);padding:10px 20px;border-radius:4px} .help b{color:#ffd24a;font-family:var(--ui);font-size:14px;letter-spacing:.04em}

  /* quest list: vertical stack of screenshot banners; the hovered / focused one extends downward to show the mission */
  #levelList{display:flex;flex-direction:column;gap:7px;width:min(700px,94vw);max-height:min(54vh,520px);overflow-y:auto;padding:6px 10px 8px 6px;text-align:left;scrollbar-width:thin;scrollbar-color:#8a6a2c #140c05}
  #levelList::-webkit-scrollbar{width:8px} #levelList::-webkit-scrollbar-thumb{background:#8a6a2c;border-radius:4px} #levelList::-webkit-scrollbar-track{background:#140c05}
  /* camp screen: compact header, and the quest list takes ALL the remaining height (no more cut-off missions) */
  #screen:has(#levelList){justify-content:flex-start;overflow:hidden;padding:12px 12px 6px}
  #screen:has(#levelList) h2{font-size:clamp(22px,3.4vw,32px);margin:0}
  #screen:has(#levelList) p{margin:3px 0;font-size:17px} #screen:has(#levelList) .menu.row .btn{padding:8px 34px;margin:4px;min-width:220px;font-size:16px}
  #screen:has(#levelList) .rule{margin:6px auto}
  #screen:has(#levelList) #levelList{flex:1 1 0;min-height:0;max-height:none;width:min(780px,96vw);padding-bottom:30px;-webkit-mask-image:linear-gradient(#000 calc(100% - 30px),transparent);mask-image:linear-gradient(#000 calc(100% - 30px),transparent)}
  .statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;width:min(300px,92vw);margin:8px auto;text-align:left}
  .st{display:flex;align-items:baseline;gap:6px;background:rgba(20,12,4,.6);border:1px solid rgba(138,106,44,.6);border-radius:3px;padding:3px 8px;font-size:15px;white-space:nowrap}
  .st i{font-style:normal;width:20px;text-align:center} .st b{color:#ffe9a8} .st b em{font-style:normal;font-weight:400;font-size:12px;color:#c8a458} .st small{margin-left:auto;font-size:11px;color:#b09a70;letter-spacing:.06em;text-transform:uppercase}
  @media (max-height:560px){.statgrid{grid-template-columns:repeat(4,auto);width:auto;gap:3px 6px}.st{font-size:13px;padding:2px 6px}.st small{display:none}}
  #campWrap,#campSide,#campMain{display:contents}
  @media (min-width:900px) and (min-height:561px){
    body:not(.touch) #screen:has(#campWrap){justify-content:center;padding:20px 28px}
    body:not(.touch) #campWrap{display:flex;flex-direction:row;align-items:stretch;gap:36px;width:min(1180px,96vw);height:100%;min-height:0}
    body:not(.touch) #campSide{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 300px;text-align:center}
    body:not(.touch) #campSide .menu.row{flex-direction:column}
    body:not(.touch) #campMain{display:flex;flex-direction:column;flex:1 1 0;min-width:0;min-height:0}
    body:not(.touch) #screen:has(#campWrap) #levelList{width:100%}
  }
  .lvl{pointer-events:auto;cursor:pointer;display:block;flex:none;padding:0;margin:0;width:100%;text-align:left;font:inherit;color:#f0e2b8;background:#140c05;border:1px solid var(--gold-d);border-radius:3px;overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.6);transition:border-color .2s,box-shadow .2s,transform .15s}
  .lvl-banner{position:relative;display:block;height:112px;background:#1c130a center/cover no-repeat}
  .lvl-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,4,2,.92) 0%,rgba(8,4,2,.62) 42%,rgba(8,4,2,.08) 100%)}
  .lvl-text{position:absolute;left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;max-width:70%}
  .lvl-num{font:700 12px var(--ui);letter-spacing:.24em;text-transform:uppercase;color:#c8a458}
  .lvl-name{font:700 clamp(18px,3vw,25px)/1.1 var(--ui);color:#ffe9a8;letter-spacing:.03em;text-shadow:0 2px 3px #000,0 0 14px rgba(0,0,0,.8)}
  .lvl-goal{font:italic 400 15px 'Alegreya',serif;color:#cfe8c0;text-shadow:0 1px 2px #000}
  .lvl-badge{position:absolute;right:10px;top:9px;font:700 11px var(--ui);letter-spacing:.14em;padding:3px 9px;border-radius:2px;background:rgba(0,0,0,.7);border:1px solid var(--gold-d);color:#c8a458}
  .lvl.next .lvl-badge{background:#ffd24a;color:#2a1604;border-color:#fff2c0;box-shadow:0 0 14px rgba(255,200,60,.7)} .lvl.done .lvl-badge{color:#9bffb0;border-color:#4a8a5a}
  .lvl-desc{display:block;max-height:0;opacity:0;overflow:hidden;background:linear-gradient(180deg,#1f140a,#150d06);transition:max-height .32s ease,opacity .28s ease}
  .lvl-desc-in{display:block;padding:11px 16px 14px;font-size:18px;line-height:1.38;color:#e6d8b0;border-top:1px solid rgba(138,106,44,.55)}
  .lvl:hover,.lvl:focus-visible,.lvl.focus{outline:none;border-color:#ffd24a;box-shadow:0 0 0 1px #ffd24a,0 6px 22px rgba(0,0,0,.75),0 0 24px rgba(255,170,50,.35)}
  .lvl:hover .lvl-desc,.lvl:focus-visible .lvl-desc,.lvl.focus .lvl-desc{max-height:150px;opacity:1}
  .lvl.focus{outline:2px solid #9bffb0;outline-offset:2px}
  .lvl.locked{cursor:not-allowed;filter:grayscale(.85) brightness(.55)} .lvl.locked .lvl-banner{background-image:repeating-linear-gradient(45deg,#1a120a 0 10px,#150e07 10px 20px)}
  /* touch controls */
  #touchui{display:none} body.touch #touchui{display:block}
  #touchui>*{pointer-events:auto;touch-action:none}
  #moveZone{position:absolute;left:0;bottom:0;width:42%;height:62%} #lookZone{position:absolute;right:0;top:0;width:58%;height:100%}
  #stick{display:none;position:fixed;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);pointer-events:none}
  #knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:rgba(255,235,170,.65);border:2px solid #fff}
  .tbtn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(20,12,4,.55);border:3px solid rgba(216,178,90,.8);color:#fff1c8;font-weight:bold;user-select:none;-webkit-user-select:none}
  .tbtn.down{background:rgba(255,210,90,.55)}
  #tSword{right:26px;bottom:34px;width:86px;height:86px;font-size:38px} #tBolt{right:124px;bottom:28px;width:70px;height:70px;font-size:30px;border-color:#7ad0ff}
  #tUse{right:34px;bottom:140px;width:60px;height:60px;font-size:24px}
  #tPause{right:16px;top:176px;width:44px;height:44px;font-size:16px}
  #rotate{display:none;position:fixed;inset:0;z-index:20;background:#000;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:30px}
  @media (orientation:portrait){body.touch #rotate{display:flex}}
  @media (max-height:560px){
    #screen{padding:8px} #screen p{font-size:15px;margin:3px} .help{display:none} .crest{display:none}
    .btn{min-width:200px;padding:8px 28px;font-size:15px;margin:4px} .btn small{font-size:13px;margin-top:2px}
    #levelList{max-height:46vh} .lvl-banner{height:70px} .lvl-name{font-size:17px} .lvl-desc-in{font-size:15px;padding:7px 12px 9px}
    #hud .panel{padding:4px 8px} #hearts span{font-size:18px} #bl{min-width:150px;left:8px;bottom:8px} #br{right:auto;left:8px;bottom:62px;font-size:13px;display:none}
    #tl{left:8px;top:8px;max-width:240px} #lvlTitle{font-size:14px} #objective{font-size:11px}
    #minimap{width:120px;height:96px;right:8px;top:8px} #msg{font-size:15px;top:9%;padding:6px 12px} #prompt{font-size:16px} #bubble{font-size:15px;bottom:60px;padding:8px 12px}
    #boss{width:260px} #tPause{top:112px;right:8px}
  }
  #loading{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;font-size:24px;z-index:9}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="tl" class="panel"><div id="lvlTitle"></div><div id="objective"></div></div>
  <canvas id="minimap" width="200" height="160"></canvas>
  <div id="boss"><div id="bossName" style="font-weight:bold;margin-bottom:2px"></div><div id="bossBar"><div id="bossFill"></div></div></div>
  <div id="touchui"><div id="moveZone"></div><div id="lookZone"></div><div id="stick"><div id="knob"></div></div>
    <div class="tbtn" id="tSword">⚔</div><div class="tbtn" id="tBolt">⚡</div><div class="tbtn" id="tUse">E</div><div class="tbtn" id="tPause">❚❚</div></div>
  <div id="cross"></div><div id="prompt"></div><div id="msg"></div><div id="bubble"></div>
  <div id="bl" class="panel"><div id="hearts"></div>
    <div class="manawrap"><div id="manaFill"></div><div id="manaTxt"></div></div>
    <div class="keys" style="margin-top:4px">⚡ Magic (right-click / F)</div></div>
  <div id="br" class="panel">🪙 Gold <b id="gold">0</b><div id="amulet" title="Amulet of Rebirth: revives you once at full health">📿 Amulet of Rebirth</div>
    <div class="keys">E use · click: sword · right-click: lightning</div></div>
  <div id="flash"></div>
</div>
<div id="screen"></div>
<div id="rotate">📱↻<br><br>Please rotate your device to landscape to play.</div>
<div id="loading">Loading models…</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
